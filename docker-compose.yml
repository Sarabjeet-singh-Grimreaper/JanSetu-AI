services:
  jansetu-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jansetu-ai-platform
    ports:
      - "5000:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    restart: unless-stopped
